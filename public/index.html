  <!-- 字体来源与 src/index.css 的 @import 一致：提前建连，缩短首屏字体等待 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- 首屏兜底 + 防闪（顺序很重要）：
       1) 内联样式：样式表就绪前也保持正确底色，消除白闪；
       2) 内联脚本：在首帧之前把 <html data-theme> 写好 —— 与 React 侧同逻辑
          （src/theme/ThemeContext.tsx 的 resolveInitialTheme），
          否则会出现「先深色 → 再切成浅色」的闪屏。
       ⚠️ 加减逻辑时请同步改 ThemeContext.tsx 的 THEME_STORAGE_KEY。 -->
  <style>
    html {
      background-color: #0a0a0a;
      color: #f5f5f5;
    }

    html[data-theme="light"] {
      background-color: #ffffff;
      color: #111111;
    }
  </style>
  <script>
    (function () {
      var KEY = "shasha-theme";
      try {
        var stored = window.localStorage.getItem(KEY);
        var mode = stored === "light" || stored === "dark" ? stored : null;
        if (!mode) {
          var prefersLight =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: light)").matches;
          mode = prefersLight ? "light" : "dark";
        }
        var root = document.documentElement;
        root.setAttribute("data-theme", mode);
        root.style.colorScheme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", mode === "dark" ? "#0A0A0A" : "#FFFFFF");
      } catch (err) {
        /* 出任何意外都退回深色（站点原本的默认观感） */
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>

<body>
  <noscript>请启用 JavaScript 以浏览莎莎（Shasha）的个人主页。</noscript>
  <div id="root"></div>
</body>
