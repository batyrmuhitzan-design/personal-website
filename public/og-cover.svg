<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
  role="img" aria-label="莎莎 · Shasha —— Web 全栈开发与自动化编程">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1338" />
      <stop offset="60%" stop-color="#120c22" />
      <stop offset="100%" stop-color="#0a0614" />
    </linearGradient>
    <linearGradient id="ogAc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d18bf5" />
      <stop offset="100%" stop-color="#6f42c1" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c770f0" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#c770f0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />
  <circle cx="980" cy="90" r="330" fill="url(#ogGlow)" />
  <circle cx="120" cy="580" r="280" fill="#6f42c1" opacity="0.18" />

  <!-- 标识方块 -->
  <rect x="80" y="74" width="76" height="76" rx="22" fill="url(#ogAc)" />
  <text x="118" y="114" text-anchor="middle" dominant-baseline="central"
    font-family="'PT Mono', Consolas, monospace" font-size="42" font-weight="700"
    fill="#150a20">S</text>

  <!-- 主标题 -->
  <text x="80" y="300"
    font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="88"
    font-weight="700" fill="#ffffff">莎莎 · SHASHA</text>
  <text x="80" y="376"
    font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="40"
    fill="#d9b3f5">Web 全栈开发与自动化编程</text>
  <text x="80" y="428" font-family="'PT Mono', Consolas, monospace" font-size="26"
    fill="#9d8ab8">Web Developer &amp; Automation Specialist</text>

  <rect x="80" y="470" width="680" height="2" fill="#c770f0" opacity="0.35" />

  <text x="80" y="524" font-family="'PT Mono', Consolas, monospace" font-size="24"
    fill="#c9bde0">React · TypeScript · FastAPI · Python · Docker · PostgreSQL · C++</text>
  <text x="80" y="566" font-family="'PT Mono', Consolas, monospace" font-size="20"
    fill="#6f5c8c">把重复的事情交给代码，把时间留给创造。</text>

  <!-- 右侧代码卡片 -->
  <g>
    <rect x="812" y="150" width="308" height="330" rx="22" fill="#0f0a1d" stroke="#c770f0"
      stroke-opacity="0.45" />
    <rect x="812" y="150" width="308" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" />
    <circle cx="840" cy="172" r="6" fill="#ff5f57" />
    <circle cx="860" cy="172" r="6" fill="#febc2e" />
    <circle cx="880" cy="172" r="6" fill="#28c840" />
    <text x="898" y="178" font-family="'PT Mono', Consolas, monospace" font-size="15"
      fill="#9d8ab8">shasha.tsx</text>

    <g>
      <rect x="844" y="228" width="108" height="12" rx="6" fill="#c770f0" />
      <rect x="962" y="228" width="126" height="12" rx="6" fill="#61dafb" opacity="0.85" />
      <rect x="862" y="262" width="86" height="12" rx="6" fill="#f7df1e" opacity="0.8" />
      <rect x="958" y="262" width="130" height="12" rx="6" fill="#8b949e" opacity="0.6" />
      <rect x="862" y="296" width="150" height="12" rx="6" fill="#5fa04e" opacity="0.85" />
      <rect x="844" y="330" width="70" height="12" rx="6" fill="#ff7b72" opacity="0.85" />
      <rect x="844" y="364" width="118" height="12" rx="6" fill="#c770f0" opacity="0.9" />
      <rect x="972" y="364" width="116" height="12" rx="6" fill="#61dafb" opacity="0.7" />
      <rect x="844" y="398" width="56" height="12" rx="6" fill="#c9bde0" opacity="0.45" />
    </g>
    <text x="844" y="452" font-family="'PT Mono', Consolas, monospace" font-size="14"
      fill="#c770f0">$ docker compose up -d</text>
  </g>
</svg>
