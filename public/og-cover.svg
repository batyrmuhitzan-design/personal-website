<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
  role="img" aria-label="莎莎 · Shasha —— Web 全栈开发与自动化编程">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="60%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="ogAc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5" />
      <stop offset="100%" stop-color="#8a8a8a" />
    </linearGradient>
    <radialGradient id="ogGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e5e5e5" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#e5e5e5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ogBg)" />
  <circle cx="980" cy="90" r="330" fill="url(#ogGlow)" />
  <circle cx="120" cy="580" r="280" fill="#8a8a8a" opacity="0.18" />

  <!-- 标识方块 -->
  <rect x="80" y="74" width="76" height="76" rx="22" fill="url(#ogAc)" />
  <text x="118" y="114" text-anchor="middle" dominant-baseline="central"
    font-family="'PT Mono', Consolas, monospace" font-size="42" font-weight="700"
    fill="#141414">S</text>

  <!-- 主标题 -->
  <text x="80" y="300"
    font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="88"
    font-weight="700" fill="#ffffff">莎莎 · SHASHA</text>
  <text x="80" y="376"
    font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="40"
    fill="#d4d4d4">Web 全栈开发与自动化编程</text>
  <text x="80" y="428" font-family="'PT Mono', Consolas, monospace" font-size="26"
    fill="#9d9d9d">Web Developer &amp; Automation Specialist</text>

  <rect x="80" y="470" width="680" height="2" fill="#e5e5e5" opacity="0.35" />

  <text x="80" y="524" font-family="'PT Mono', Consolas, monospace" font-size="24"
    fill="#c9c9c9">React · TypeScript · FastAPI · Python · Docker · PostgreSQL · C++</text>
  <text x="80" y="566" font-family="'PT Mono', Consolas, monospace" font-size="20"
    fill="#6f6f6f">把重复的事情交给代码，把时间留给创造。</text>

  <!-- 右侧代码卡片 -->
  <g>
    <rect x="812" y="150" width="308" height="330" rx="22" fill="#0f0f0f" stroke="#e5e5e5"
      stroke-opacity="0.45" />
    <rect x="812" y="150" width="308" height="44" rx="22" fill="#ffffff" fill-opacity="0.05" />
    <circle cx="840" cy="172" r="6" fill="#6b6b6b" />
    <circle cx="860" cy="172" r="6" fill="#8a8a8a" />
    <circle cx="880" cy="172" r="6" fill="#b0b0b0" />
    <text x="898" y="178" font-family="'PT Mono', Consolas, monospace" font-size="15"
      fill="#9d9d9d">shasha.tsx</text>

    <g>
      <rect x="844" y="228" width="108" height="12" rx="6" fill="#e5e5e5" />
      <rect x="962" y="228" width="126" height="12" rx="6" fill="#d4d4d4" opacity="0.85" />
      <rect x="862" y="262" width="86" height="12" rx="6" fill="#e5e5e5" opacity="0.8" />
      <rect x="958" y="262" width="130" height="12" rx="6" fill="#8b8b8b" opacity="0.6" />
      <rect x="862" y="296" width="150" height="12" rx="6" fill="#a3a3a3" opacity="0.85" />
      <rect x="844" y="330" width="70" height="12" rx="6" fill="#9a9a9a" opacity="0.85" />
      <rect x="844" y="364" width="118" height="12" rx="6" fill="#e5e5e5" opacity="0.9" />
      <rect x="972" y="364" width="116" height="12" rx="6" fill="#d4d4d4" opacity="0.7" />
      <rect x="844" y="398" width="56" height="12" rx="6" fill="#c9c9c9" opacity="0.45" />
    </g>
    <text x="844" y="452" font-family="'PT Mono', Consolas, monospace" font-size="14"
      fill="#e5e5e5">$ docker compose up -d</text>
  </g>
</svg>
