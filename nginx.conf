# ==========================================================================
#  莎莎 · 个人主页 Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#  SPA 单页应用：所有未命中静态文件的请求都回退到 index.html
# ==========================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # ------------------------- gzip 压缩 -------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/xml
                      application/javascript application/json
                      application/x-font-ttf font/opentype image/svg+xml;
    gzip_disable      "MSIE [1-6]\.";

    # ------------------------- 安全响应头 -------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------- 路由回退 -------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 入口 HTML 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # CRA 产物文件名带 content hash，可长期强缓存
    location ~* \.(?:js|css|svg|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ------------------- 音乐解析服务反向代理 -------------------
    # 前端同源访问 /music/api/*，实际由容器 music-api:8080 处理：
    #   /music/api/playlist  榜单曲目     /music/api/lrc   歌词文本（同源，规避跨域）
    #   /music/api/stream    音频转发（透传 Range，关闭缓冲以便边下边播、拖动进度）
    # 用 rewrite + 变量 proxy_pass：nginx 启动时不会因为 music-api 未就绪而报
    # 「host not found in upstream」，服务重启后也能自动恢复解析。
    location /music/api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $music_api "http://music-api:8080";
        rewrite ^/music/api/(.*)$ /api/$1 break;
        proxy_pass $music_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 音频/歌词流：不缓冲，长连接超时放宽
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_connect_timeout   10s;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;

        # 解析结果与音源直链都带时效，不做缓存
        add_header Cache-Control "no-store" always;
    }

    # 健康检查（也是 Dockerfile HEALTHCHECK 的目标）
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    error_page 404 /index.html;
}
