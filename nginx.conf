# ==========================================================================
#  莎莎 · 个人主页 Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#  SPA 单页应用：所有未命中静态文件的请求都回退到 index.html
# ==========================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;
    charset utf-8;

    # ------------------------- gzip 压缩 -------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/xml
                      application/javascript application/json
                      application/x-font-ttf font/opentype image/svg+xml;
    gzip_disable      "MSIE [1-6]\.";

    # ------------------------- 安全响应头 -------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ------------------------- 路由回退 -------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 入口 HTML 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # CRA 产物文件名带 content hash，可长期强缓存
    location ~* \.(?:js|css|svg|woff2?|ttf|eot|otf|png|jpe?g|gif|ico|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # 健康检查（也是 Dockerfile HEALTHCHECK 的目标）
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    error_page 404 /index.html;
}
