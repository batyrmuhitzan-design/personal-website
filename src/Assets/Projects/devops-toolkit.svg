<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450"
  role="img" aria-label="DevOps Toolkit 一键部署工具箱">
  <defs>
    <linearGradient id="dtBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="dtAc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9c9c9" />
      <stop offset="100%" stop-color="#b0b0b0" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#dtBg)" />
  <circle cx="690" cy="80" r="175" fill="#b0b0b0" opacity="0.15" />
  <circle cx="90" cy="400" r="140" fill="#a3a3a3" opacity="0.12" />
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M100 0V450M200 0V450M300 0V450M400 0V450M500 0V450M600 0V450M700 0V450" />
    <path d="M0 90H800M0 180H800M0 270H800M0 360H800" />
  </g>

  <rect x="48" y="40" width="282" height="34" rx="17" fill="url(#dtAc)" />
  <text x="68" y="63" font-family="'PT Mono', Consolas, monospace" font-size="17"
    font-weight="600" fill="#0a0a0a">DOCKER · NGINX · CI/CD</text>

  <!-- 容器堆叠 -->
  <g>
    <rect x="48" y="116" width="300" height="52" rx="12" fill="#0d0d0d" stroke="#b0b0b0"
      stroke-opacity="0.6" />
    <rect x="66" y="134" width="16" height="16" rx="4" fill="#b0b0b0" opacity="0.85" />
    <rect x="94" y="136" width="120" height="12" rx="6" fill="#ffffff" opacity="0.35" />
    <text x="308" y="150" text-anchor="middle" font-family="'PT Mono', Consolas, monospace"
      font-size="14" fill="#c9c9c9">up</text>

    <rect x="48" y="178" width="300" height="52" rx="12" fill="#0d0d0d" stroke="#b0b0b0"
      stroke-opacity="0.6" />
    <rect x="66" y="196" width="16" height="16" rx="4" fill="#b0b0b0" opacity="0.6" />
    <rect x="94" y="198" width="92" height="12" rx="6" fill="#ffffff" opacity="0.3" />
    <text x="308" y="212" text-anchor="middle" font-family="'PT Mono', Consolas, monospace"
      font-size="14" fill="#c9c9c9">up</text>

    <rect x="48" y="240" width="300" height="52" rx="12" fill="#0d0d0d" stroke="#a3a3a3"
      stroke-opacity="0.6" />
    <rect x="66" y="258" width="16" height="16" rx="4" fill="#a3a3a3" opacity="0.8" />
    <rect x="94" y="260" width="140" height="12" rx="6" fill="#ffffff" opacity="0.25" />
    <text x="308" y="274" text-anchor="middle" font-family="'PT Mono', Consolas, monospace"
      font-size="14" fill="#d4d4d4">8080→80</text>
  </g>

  <!-- 终端 -->
  <rect x="382" y="116" width="370" height="176" rx="16" fill="#0b0b0b" stroke="#b0b0b0"
    stroke-opacity="0.5" />
  <rect x="382" y="116" width="370" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="404" cy="132" r="5" fill="#6b6b6b" />
  <circle cx="420" cy="132" r="5" fill="#8a8a8a" />
  <circle cx="436" cy="132" r="5" fill="#b0b0b0" />
  <g font-family="'PT Mono', Consolas, monospace" font-size="16">
    <text x="404" y="180" fill="#c9c9c9">$ ./deploy.sh --prod</text>
    <text x="404" y="212" fill="#c9c9c9">▸ build image ... ok</text>
    <text x="404" y="240" fill="#c9c9c9">▸ push &amp; reload nginx ... ok</text>
    <text x="404" y="268" fill="#d4d4d4">✔ released in 42s · health check pass</text>
  </g>

  <!-- 流程小标签 -->
  <g font-family="'PT Mono', Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="48" y="312" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
      stroke="#b0b0b0" stroke-opacity="0.5" />
    <text x="104" y="334" fill="#d4d4d4">build</text>
    <rect x="172" y="312" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
      stroke="#b0b0b0" stroke-opacity="0.5" />
    <text x="228" y="334" fill="#d4d4d4">ship</text>
    <rect x="296" y="312" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
      stroke="#b0b0b0" stroke-opacity="0.5" />
    <text x="352" y="334" fill="#d4d4d4">rollback</text>
  </g>

  <text x="48" y="392" font-family="'PT Mono', Consolas, monospace" font-size="42"
    font-weight="700" fill="#ffffff">DevOps Toolkit</text>
  <text x="48" y="428" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22"
    fill="#c9c9c9">一键部署工具箱 · 一条命令完成上线</text>
</svg>
