      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="naAc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4d4d4" />
      <stop offset="100%" stop-color="#8a8a8a" />
