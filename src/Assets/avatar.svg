  <rect x="88" y="204" width="152" height="10" rx="5" fill="#c770f0" opacity="0.9" />
  <rect x="88" y="224" width="200" height="10" rx="5" fill="#61dafb" opacity="0.7" />
  <rect x="88" y="244" width="112" height="10" rx="5" fill="#f7df1e" opacity="0.7" />

