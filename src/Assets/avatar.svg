<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400"
  role="img" aria-label="莎莎 Shasha 头像">
  <defs>
    <linearGradient id="avBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#232323" />
      <stop offset="55%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>
    <radialGradient id="avGlow" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#e5e5e5" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#e5e5e5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#avBg)" />
  <circle cx="200" cy="146" r="172" fill="url(#avGlow)" />

  <!-- 终端窗口 -->
  <rect x="72" y="110" width="256" height="170" rx="16" fill="#0b0b0b" stroke="#e5e5e5"
    stroke-opacity="0.45" />
  <rect x="72" y="110" width="256" height="32" rx="16" fill="#ffffff" fill-opacity="0.06" />
  <circle cx="94" cy="126" r="5" fill="#6b6b6b" />
  <circle cx="110" cy="126" r="5" fill="#8a8a8a" />
  <circle cx="126" cy="126" r="5" fill="#b0b0b0" />
  <text x="88" y="188" font-family="'PT Mono', Consolas, monospace" font-size="20"
    fill="#b0b0b0">&gt;_</text>
  <rect x="88" y="204" width="152" height="10" rx="5" fill="#e5e5e5" opacity="0.9" />
  <rect x="88" y="224" width="200" height="10" rx="5" fill="#d4d4d4" opacity="0.7" />
  <rect x="88" y="244" width="112" height="10" rx="5" fill="#e5e5e5" opacity="0.7" />

  <!-- 名字 -->
  <text x="200" y="322" text-anchor="middle" font-family="'PT Mono', Consolas, monospace"
    font-size="26" font-weight="700" letter-spacing="4" fill="#ffffff">SHASHA</text>
  <text x="200" y="352" text-anchor="middle" font-family="'PT Mono', Consolas, monospace"
